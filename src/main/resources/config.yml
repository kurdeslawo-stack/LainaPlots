# MiniMessage: https://docs.advntr.dev/minimessage/format.html
gui-title: "<gradient:#58d68d:#2ecc71><bold>Twoje działki</bold></gradient>"

# GUI ma maksymalnie 28 miejsc na działki. Mniejsze wartości tworzą więcej stron.
plots-per-page: 28

# Wbudowana paczka ikon. Na serwerze publicznym zmień 127.0.0.1 na adres serwera.
# Aby zmienić grafikę bez ruszania Javy, podmień plugins/LainaPlots/LainaPlots-Icons.zip
# i wykonaj /dzialki reload.
resource-pack:
  enabled: false
  url: "http://127.0.0.1:8124/lainaplots-icons.zip"
  required: false
  prompt: "<green>Ikony menu działek LainaPlots"
  file: "LainaPlots-Icons.zip"
  serve:
    enabled: false
    bind-address: "0.0.0.0"
    port: 8124

gui:
  icons:
    filter:
      material: HOPPER
      custom-model-data: 0
    summary:
      material: PAPER
      custom-model-data: 71005
    previous-page:
      material: ARROW
      custom-model-data: 0
    next-page:
      material: ARROW
      custom-model-data: 0
    refresh:
      material: SUNFLOWER
      custom-model-data: 0
    filler:
      material: BLACK_STAINED_GLASS_PANE
      custom-model-data: 0
    owner-plot:
      material: PAPER
      custom-model-data: 71001
    member-plot:
      material: PAPER
      custom-model-data: 71002
    # Opcjonalne osobne ikony dla ulubionych. Stare configi użyją fallbacków.
    favorite-owner-plot:
      material: PAPER
      custom-model-data: 71003
    favorite-member-plot:
      material: PAPER
      custom-model-data: 71004
    loading:
      material: CLOCK
      custom-model-data: 0
    empty-state:
      material: FLOWER_POT
      custom-model-data: 0

messages:
  no-permission: "<red>Nie masz uprawnień do tej komendy."
  players-only: "<red>Ta komenda jest dostępna tylko dla gracza."
  loading: "<gray>Wczytuję Twoje działki…"
  load-failed: "<red>Nie udało się wczytać działek. Spróbuj ponownie."
  cross-world-unavailable: "<red>ProtectionStones nie może bezpiecznie znaleźć tej nienazwanej działki w innym świecie. Najpierw nadaj jej nazwę przez /ps name."
  cross-world-resolution-failed: "<red>ProtectionStones nie może jednoznacznie znaleźć tej działki z innego świata. Odśwież GUI lub nadaj działce unikalną nazwę."
  invalid-region-identifier: "<red>Identyfikator działki nie może zostać bezpiecznie przekazany do ProtectionStones."
  protectionstones-command-unavailable: "<red>Komenda teleportacyjna ProtectionStones jest niedostępna."
  reloaded: "<green>Konfiguracja LainaPlots została przeładowana."
